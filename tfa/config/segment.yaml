profile: default
segmentation:
  strategy: IDLE_GAP            # ENTRY_MARKER | IDLE_GAP | CORRELATION_ID
  entryCallSites: [com.acme.web.Dispatcher:10]
  terminalCallSites: [com.acme.web.Dispatcher:99]
  idleGapMillis: 5000               # used by IDLE_GAP
clustering:
  signatureK: 3
  minClusterSize: 10
  clusterCeiling: 200
baseline:
  alternatives: 3
detection:
  timingFactor: 3.0
  censorMarginMillis: 60000 
ranking:
  weights:
    rarity: 1.0
    severity: 1.0
    error: 0.5
    magnitude: 0.5
    clusterSize: 0.5
  benignVariantPenalty: 0.2
  topN: 20